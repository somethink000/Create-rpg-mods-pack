plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base { archivesName = 'antique_atlas-neoforge' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url "https://repo.sleeping.town/" }
}

neoForge {
    version = project.neo_version
    accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        server { server(); programArgument '--nogui' }
    }
    mods {
        antique_atlas { sourceSet(sourceSets.main) }
        surveyor { sourceSet(sourceSets.main) }
    }
}

dependencies {
    // Config library (loader-agnostic), shipped inside the jar.
    jarJar(implementation("folk.sisby:kaleido-config")) { version { strictly '[0.3.3+1.3.2,)'; prefer '0.3.3+1.3.2' } }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
